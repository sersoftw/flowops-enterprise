name: Backend & Infrastructure
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: flowops-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tool versions
        run: |
          java -version
          ./mvnw -version
          docker version
          docker compose version
      - name: Maven build and smoke tests
        run: ./mvnw -B -ntp -Dpostgres.tests=true clean verify
      - name: Compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Verify clean Compose installation
        run: |
          test -z "$(docker compose ps -aq)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          echo "Clean project confirmed: no existing containers or data volumes"
      - name: Build and start service containers
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Smoke test health endpoints
        run: bash scripts/health-check.sh
      - name: Verify database isolation
        run: bash scripts/verify-db-isolation.sh
      - name: Verify order API and persistence after restart
        run: bash scripts/verify-orders.sh
      - name: Repeatable MVP demo and recovery
        run: |
          bash scripts/seed-demo-data.sh
          bash scripts/seed-demo-data.sh
          bash scripts/demo-scenarios.sh --output build/demo-first.json
          bash scripts/seed-demo-data.sh
          bash scripts/demo-scenarios.sh --restart --output build/demo-repeat-restart.json
      - name: Verify Kafka listeners and persistence
        run: bash scripts/verify-kafka.sh
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --tail=150 || true
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/*/target/surefire-reports/
            backend/*/target/failsafe-reports/
            backend/integration-tests/target/*.log
            build/demo-*.json
      - name: Clean up
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down -v || true
          fi
