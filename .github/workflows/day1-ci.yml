name: Backend & Infrastructure
on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tool versions
        run: |
          java -version
          ./mvnw -version
          docker version
          docker compose version
      - name: Maven build and smoke tests
        run: ./mvnw -B -ntp -Dpostgres.tests=true clean verify
      - name: Compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build and start service containers
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Smoke test health endpoints
        run: bash scripts/health-check.sh
      - name: Verify database isolation
        run: bash scripts/verify-db-isolation.sh
      - name: Verify order API and persistence after restart
        run: bash scripts/verify-orders.sh
      - name: Verify Kafka listeners and persistence
        run: bash scripts/verify-kafka.sh
      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --tail=150 || true
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/*/target/surefire-reports/
      - name: Clean up
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down -v || true
          fi
