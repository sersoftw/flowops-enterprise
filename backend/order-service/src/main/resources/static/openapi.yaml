openapi: 3.1.0
info:
  title: FlowOps Order API
  version: 0.2.0
  description: Day 2 API. Development only; no authentication or payment authorization.
servers:
  - url: http://localhost:8081
paths:
  /api/orders:
    post:
      operationId: createOrder
      summary: Create an order or replay an identical request
      description: Keys are global and retained indefinitely. Compare customer, currency and ordered items with normalized prices. Reusing a key with different content returns 409.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrder'}
      responses:
        '201':
          description: Created in PENDING status
          headers:
            Location: {schema: {type: string}, description: Relative URL of the order}
            Idempotency-Replayed: {schema: {type: string, enum: ['false']}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '200':
          description: Replay of the original order
          headers:
            Location: {schema: {type: string}, description: Relative URL of the order}
            Idempotency-Replayed: {schema: {type: string, enum: ['true']}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: Key already used for a different request
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    get:
      operationId: listOrders
      summary: List orders ordered by createdAt descending, then ID descending
      parameters:
        - {in: query, name: customerId, schema: {type: string, format: uuid}}
        - {in: query, name: status, schema: {type: string, enum: [PENDING]}}
        - {in: query, name: page, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: A page of orders; filters combine with AND
          content:
            application/json:
              schema:
                type: object
                required: [content, page, size, totalElements, totalPages]
                properties:
                  content: {type: array, items: {$ref: '#/components/schemas/Order'}}
                  page: {type: integer}
                  size: {type: integer}
                  totalElements: {type: integer, format: int64}
                  totalPages: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/orders/{id}:
    get:
      operationId: getOrder
      summary: Retrieve a persisted order
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404':
          description: Order not found
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
components:
  responses:
    BadRequest:
      description: Invalid body, header or query parameter
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CreateOrder:
      type: object
      additionalProperties: false
      required: [customerId, currency, items]
      properties:
        customerId: {type: string, format: uuid}
        currency: {type: string, pattern: '^[A-Z]{3}$', description: ISO 4217 code; this API supports two decimal places for all currencies, example: EUR}
        items: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Item'}}
    Item:
      type: object
      additionalProperties: false
      required: [productId, quantity, unitPrice]
      properties:
        productId: {type: string, minLength: 1, maxLength: 100, pattern: '^(?=[\s\S]*\S)[^\u0000]*$', description: Nonblank identifier without NUL characters, example: sku-1}
        quantity: {type: integer, minimum: 1, maximum: 10000}
        unitPrice: {type: number, minimum: 0.01, maximum: 999999999.99, multipleOf: 0.01}
    Order:
      type: object
      additionalProperties: false
      required: [id, customerId, currency, items, status, createdAt, total]
      properties:
        id: {type: string, format: uuid}
        customerId: {$ref: '#/components/schemas/CreateOrder/properties/customerId'}
        currency: {$ref: '#/components/schemas/CreateOrder/properties/currency'}
        items: {$ref: '#/components/schemas/CreateOrder/properties/items'}
        status: {type: string, enum: [PENDING]}
        createdAt: {type: string, format: date-time}
        total: {type: number, description: Sum of quantity times unitPrice computed by the server}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
